name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify tag matches manifest.json
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($VERSION) does not match manifest.json version ($MANIFEST_VERSION)" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:js

      - name: Build .miyaplugin archive
        run: zip -q example.miyaplugin manifest.json main.js CHANGELOG.md

      - name: Extract changelog section
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1; next }
            /^## /   { if (found) exit; if ($2 == ver) found=1; next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $TAG" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: example.miyaplugin
          body_path: release_notes.md
